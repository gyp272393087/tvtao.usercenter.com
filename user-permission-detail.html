<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户权限详情</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            padding: 24px;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        
        h1 {
            font-size: 24px;
            color: #333;
            font-weight: 500;
        }
        
        .btn-back {
            padding: 8px 20px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            background: white;
            color: #666;
            text-decoration: none;
            transition: all 0.3s;
        }
        
        .btn-back:hover {
            border-color: #1890ff;
            color: #1890ff;
        }
        
        .user-info {
            background: #fafafa;
            padding: 16px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 14px;
            color: #666;
        }
        
        .table-section {
            overflow-x: auto;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        
        thead {
            background: #fafafa;
        }
        
        th {
            padding: 12px;
            text-align: left;
            font-weight: 500;
            color: #333;
            border-bottom: 1px solid #e8e8e8;
        }
        
        td {
            padding: 12px;
            border-bottom: 1px solid #f0f0f0;
            color: #666;
        }
        
        tbody tr:hover {
            background: #fafafa;
        }
        
        .empty-state {
            text-align: center;
            padding: 40px;
            color: #999;
        }
        
        .operation-buttons {
            display: flex;
            gap: 8px;
        }
        
        .btn-action {
            padding: 4px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            background: white;
            color: #666;
            transition: all 0.3s;
        }
        
        .btn-action:hover {
            border-color: #1890ff;
            color: #1890ff;
        }
        
        .btn {
            padding: 8px 20px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-primary {
            background: #1890ff;
            color: white;
        }
        
        .btn-primary:hover {
            background: #40a9ff;
        }
        
        .btn-reset {
            background: #fff;
            color: #666;
            border: 1px solid #ddd;
        }
        
        .btn-reset:hover {
            border-color: #1890ff;
            color: #1890ff;
        }
        
        .btn-view {
            color: #1890ff;
        }
        
        .btn-view:hover {
            background: #e6f7ff;
            border-color: #1890ff;
        }
        
        .btn-grant {
            color: #52c41a;
        }
        
        .btn-grant:hover {
            background: #f6ffed;
            border-color: #52c41a;
        }
        
        .btn-remove {
            color: #ff4d4f;
        }
        
        .btn-remove:hover {
            background: #fff1f0;
            border-color: #ff4d4f;
        }
        
        /* 弹窗样式 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        
        .modal.show {
            display: flex;
        }
        
        .modal-content {
            background: white;
            border-radius: 8px;
            padding: 24px;
            width: 90%;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .modal-title {
            font-size: 18px;
            font-weight: 500;
            color: #333;
        }
        
        .modal-close {
            background: none;
            border: none;
            font-size: 24px;
            color: #999;
            cursor: pointer;
            padding: 0;
            width: 24px;
            height: 24px;
            line-height: 24px;
        }
        
        .modal-close:hover {
            color: #333;
        }
        
        .modal-form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        
        .form-item {
            display: flex;
            flex-direction: column;
        }
        
        .form-item label {
            font-size: 14px;
            color: #666;
            margin-bottom: 6px;
        }
        
        .form-item input,
        .form-item select {
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }
        
        .form-item input:focus,
        .form-item select:focus {
            outline: none;
            border-color: #1890ff;
        }
        
        .form-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 8px;
        }
        
        /* 权限树样式 */
        .permission-tree {
            border: 1px solid #ddd;
            border-radius: 4px;
            max-height: 400px;
            overflow-y: auto;
            padding: 8px;
            background: #fafafa;
        }
        
        .tree-node {
            margin: 4px 0;
        }
        
        .tree-node-content {
            display: flex;
            align-items: center;
            padding: 4px 8px;
            cursor: pointer;
            border-radius: 4px;
            transition: background 0.2s;
        }
        
        .tree-node-content:hover {
            background: #e6f7ff;
        }
        
        .tree-toggle {
            width: 16px;
            height: 16px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-right: 4px;
            cursor: pointer;
            color: #666;
            font-size: 12px;
        }
        
        .tree-toggle:hover {
            color: #1890ff;
        }
        
        .tree-checkbox {
            margin-right: 6px;
            cursor: pointer;
        }
        
        .tree-label {
            flex: 1;
            font-size: 14px;
            color: #333;
        }
        
        .tree-children {
            margin-left: 20px;
            display: none;
        }
        
        .tree-children.expanded {
            display: block;
        }
        
        .tree-node.leaf .tree-toggle {
            visibility: hidden;
        }
        
        /* 只读权限树样式 */
        .permission-tree.readonly .tree-checkbox {
            display: none;
        }
        
        .permission-tree.readonly .tree-node-content {
            cursor: default;
        }
        
        .permission-tree.readonly .tree-node-content:hover {
            background: transparent;
        }
        
        .permission-tree.readonly .tree-children {
            display: block;
        }
        
        .permission-tree.readonly .tree-toggle {
            visibility: hidden;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>用户权限详情</h1>
            <a href="user-management.html" class="btn-back">返回</a>
        </div>
        
        <div class="user-info" id="userInfo">
            <!-- 用户信息将通过JavaScript动态生成 -->
        </div>
        
        <div class="table-section">
            <table>
                <thead>
                    <tr>
                        <th>域</th>
                        <th>权限总数</th>
                        <th>生效权限数量</th>
                        <th>审批中权限数量</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- 数据将通过JavaScript动态生成 -->
                </tbody>
            </table>
            <div id="emptyState" class="empty-state" style="display: none;">
                暂无数据
            </div>
        </div>
    </div>
    
    <!-- 赋权弹窗 -->
    <div id="grantModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">赋权</div>
                <button type="button" class="modal-close" onclick="closeGrantModal()">&times;</button>
            </div>
            <form class="modal-form" id="grantForm" onsubmit="handleSubmitGrant(event)">
                <input type="hidden" id="grantUserId" value="">
                <input type="hidden" id="grantDomain" value="">
                <div class="form-item">
                    <label>权限域</label>
                    <input type="text" id="grantDomainDisplay" readonly style="background: #f5f5f5;">
                </div>
                <div class="form-item">
                    <label>选择权限</label>
                    <div class="permission-tree" id="grantPermissionTree">
                        <div style="padding: 20px; text-align: center; color: #999;">加载中...</div>
                    </div>
                </div>
                <div class="form-buttons">
                    <button type="button" class="btn btn-reset" onclick="closeGrantModal()">取消</button>
                    <button type="submit" class="btn btn-primary">保存</button>
                </div>
            </form>
        </div>
    </div>
    
    <!-- 查看弹窗 -->
    <div id="viewModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">查看权限</div>
                <button type="button" class="modal-close" onclick="closeViewModal()">&times;</button>
            </div>
            <div class="modal-form">
                <input type="hidden" id="viewUserId" value="">
                <input type="hidden" id="viewDomain" value="">
                <div class="form-item">
                    <label>权限域</label>
                    <input type="text" id="viewDomainDisplay" readonly style="background: #f5f5f5;">
                </div>
                <div class="form-item">
                    <label>权限列表</label>
                    <div class="permission-tree readonly" id="viewPermissionTree">
                        <div style="padding: 20px; text-align: center; color: #999;">加载中...</div>
                    </div>
                </div>
                <div class="form-buttons">
                    <button type="button" class="btn btn-reset" onclick="closeViewModal()">关闭</button>
                </div>
            </div>
        </div>
    </div>
    
    <!-- 移除弹窗 -->
    <div id="removeModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">移除权限</div>
                <button type="button" class="modal-close" onclick="closeRemoveModal()">&times;</button>
            </div>
            <form class="modal-form" id="removeForm" onsubmit="handleSubmitRemove(event)">
                <input type="hidden" id="removeUserId" value="">
                <input type="hidden" id="removeDomain" value="">
                <div class="form-item">
                    <label>权限域</label>
                    <input type="text" id="removeDomainDisplay" readonly style="background: #f5f5f5;">
                </div>
                <div class="form-item">
                    <label>选择权限</label>
                    <div class="permission-tree" id="removePermissionTree">
                        <div style="padding: 20px; text-align: center; color: #999;">加载中...</div>
                    </div>
                </div>
                <div class="form-buttons">
                    <button type="button" class="btn btn-reset" onclick="closeRemoveModal()">取消</button>
                    <button type="submit" class="btn btn-primary">保存</button>
                </div>
            </form>
        </div>
    </div>

            // 权限管理域
            {

        ];
        
        // 用户-权限关联关系 { userId: [permissionId1, permissionId2, ...] }
        let userPermissions = {};
        
        // 用户权限关联关系 { userId: { domain: { total: number, active: number, pending: number } } }
        const userPermissionStats = {
            '1': {
                '用户管理': { total: 3, active: 2, pending: 1 },
                '角色管理': { total: 2, active: 2, pending: 0 },
                '权限管理': { total: 2, active: 1, pending: 1 }
            },
            '2': {
                '用户管理': { total: 3, active: 1, pending: 2 },
                '权限管理': { total: 2, active: 0, pending: 2 }
            },
            '3': {
                '用户管理': { total: 3, active: 3, pending: 0 }
            }
        };
        
        // 获取所有权限域
        function getAllDomains() {
            return [...new Set(allPermissions.map(p => p.domain))].sort();
        }
        
        // 渲染用户信息
        function renderUserInfo(userId) {
            const user = allUsers.find(u => u.id === userId);
            const userInfoDiv = document.getElementById('userInfo');
            
            if (user) {
                userInfoDiv.innerHTML = `
                    <strong>用户ID:</strong> ${user.id} | 
                    <strong>用户名称:</strong> ${user.name} | 
                    <strong>用户类型:</strong> ${user.type} | 
                    <strong>用户账号:</strong> ${user.account}
                `;
            } else {
                userInfoDiv.innerHTML = '<span style="color: #ff4d4f;">未找到用户信息</span>';
            }
        }
        
        // 计算用户权限统计数据
        function calculateUserPermissionStats(userId) {
            const userPermissionIds = userPermissions[userId] || [];
            const stats = {};
            
            // 获取所有域
            const domains = getAllDomains();
            
            domains.forEach(domain => {
                // 获取该域下的所有权限ID
                const domainPermissionIds = allPermissions
                    .filter(p => p.domain === domain)
                    .map(p => p.id);
                
                // 计算该域下用户拥有的权限
                const ownedPermissionIds = userPermissionIds.filter(id => domainPermissionIds.includes(id));
                
                // 统计：total = 拥有的权限总数，active = 生效的权限数（这里简化为全部），pending = 审批中的权限数（这里简化为0）
                stats[domain] = {
                    total: ownedPermissionIds.length,
                    active: ownedPermissionIds.length,
                    pending: 0
                };
            });
            
            return stats;
        }
        
        // 渲染表格
        function renderTable(userId) {
            const tbody = document.getElementById('tableBody');
            const emptyState = document.getElementById('emptyState');
            
            const domains = getAllDomains();
            // 优先使用 userPermissions 计算统计数据，如果没有则使用 userPermissionStats
            const stats = Object.keys(userPermissions).length > 0 
                ? calculateUserPermissionStats(userId)
                : (userPermissionStats[userId] || {});
            
            if (domains.length === 0) {
                tbody.innerHTML = '';
                emptyState.style.display = 'block';
                return;
            }
            
            emptyState.style.display = 'none';
            tbody.innerHTML = domains.map(domain => {
                const domainStats = stats[domain] || { total: 0, active: 0, pending: 0 };
                return `
                    <tr>
                        <td>${domain}</td>
                        <td>${domainStats.total}</td>
                        <td>${domainStats.active}</td>
                        <td>${domainStats.pending}</td>
                        <td>
                            <div class="operation-buttons">
                                <button type="button" class="btn-action btn-view" onclick="handleView('${userId}', '${domain}')">查看</button>
                                <button type="button" class="btn-action btn-grant" onclick="handleGrant('${userId}', '${domain}')">赋予</button>
                                <button type="button" class="btn-action btn-remove" onclick="handleRemove('${userId}', '${domain}')">移除</button>
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');
        }
        
        // 构建权限树结构
        function buildPermissionTree(domain = null, permissionIds = null) {
            // 根据域过滤权限
            let filteredPermissions = domain 
                ? allPermissions.filter(p => p.domain === domain)
                : allPermissions;
            
            // 如果指定了权限ID列表，只显示这些权限
            if (permissionIds && permissionIds.length > 0) {
                filteredPermissions = filteredPermissions.filter(p => permissionIds.includes(p.id));
            }
            
            if (filteredPermissions.length === 0) {
                return [];
            }
            
            // 创建权限映射
            const permissionMap = {};
            filteredPermissions.forEach(p => {
                permissionMap[p.id] = { ...p, children: [] };
            });
            
            // 构建树结构
            const rootNodes = [];
            filteredPermissions.forEach(p => {
                const node = permissionMap[p.id];
                if (p.parentId && permissionMap[p.parentId]) {
                    permissionMap[p.parentId].children.push(node);
                } else {
                    rootNodes.push(node);
                }
            });
            
            return rootNodes;
        }
        
        // 获取节点的所有后代ID
        function getAllDescendantIds(node) {
            const ids = [];
            if (node.children && node.children.length > 0) {
                node.children.forEach(child => {
                    ids.push(child.id);
                    ids.push(...getAllDescendantIds(child));
                });
            }
            return ids;
        }
        
        // 从权限列表中查找节点并获取所有后代ID
        function getAllDescendantIdsFromList(permissionId, allPermissions) {
            const permission = allPermissions.find(p => p.id === permissionId);
            if (!permission) return [];
            
            const permissionMap = {};
            allPermissions.forEach(p => {
                permissionMap[p.id] = { ...p, children: [] };
            });
            
            allPermissions.forEach(p => {
                if (p.parentId && permissionMap[p.parentId]) {
                    permissionMap[p.parentId].children.push(permissionMap[p.id]);
                }
            });
            
            const node = permissionMap[permissionId];
            if (!node) return [];
            
            return getAllDescendantIds(node);
        }
        
        // 获取节点的所有父节点ID
        function getAllParentIds(permissionId, allPermissions) {
            const ids = [];
            let current = allPermissions.find(p => p.id === permissionId);
            while (current && current.parentId) {
                ids.push(current.parentId);
                current = allPermissions.find(p => p.id === current.parentId);
            }
            return ids;
        }
        
        // 渲染只读权限树节点（全部展开，不可选中）
        function renderReadonlyTreeNode(node, level = 0) {
            const hasChildren = node.children && node.children.length > 0;
            const nodeDiv = document.createElement('div');
            nodeDiv.className = 'tree-node' + (hasChildren ? '' : ' leaf');
            nodeDiv.dataset.nodeId = node.id;
            
            const contentDiv = document.createElement('div');
            contentDiv.className = 'tree-node-content';
            
            // 展开/折叠按钮（隐藏，因为只读模式下全部展开）
            const toggleSpan = document.createElement('span');
            toggleSpan.className = 'tree-toggle';
            toggleSpan.style.visibility = 'hidden';
            
            // 标签
            const label = document.createElement('span');
            label.className = 'tree-label';
            label.textContent = `${node.name} (${node.code})`;
            
            contentDiv.appendChild(toggleSpan);
            contentDiv.appendChild(label);
            
            nodeDiv.appendChild(contentDiv);
            
            // 子节点（默认展开）
            if (hasChildren) {
                const childrenDiv = document.createElement('div');
                childrenDiv.className = 'tree-children expanded';
                node.children.forEach(child => {
                    childrenDiv.appendChild(renderReadonlyTreeNode(child, level + 1));
                });
                nodeDiv.appendChild(childrenDiv);
            }
            
            return nodeDiv;
        }
        
        // 渲染多选权限树节点
        function renderMultiSelectTreeNode(node, level = 0, containerId, selectedIds = []) {
            const hasChildren = node.children && node.children.length > 0;
            const nodeDiv = document.createElement('div');
            nodeDiv.className = 'tree-node' + (hasChildren ? '' : ' leaf');
            nodeDiv.dataset.nodeId = node.id;
            
            const isChecked = selectedIds.includes(node.id);
            
            const contentDiv = document.createElement('div');
            contentDiv.className = 'tree-node-content';
            
            // 展开/折叠按钮
            const toggleSpan = document.createElement('span');
            toggleSpan.className = 'tree-toggle';
            if (hasChildren) {
                toggleSpan.textContent = '▶';
                toggleSpan.onclick = function(e) {
                    e.stopPropagation();
                    toggleTreeNode(nodeDiv);
                };
            }
            
            // 多选框
            const checkbox = document.createElement('input');
            checkbox.type = 'checkbox';
            checkbox.className = 'tree-checkbox';
            checkbox.value = node.id;
            checkbox.checked = isChecked;
            checkbox.onclick = function(e) {
                e.stopPropagation();
                handleCheckboxChange(node.id, checkbox.checked, containerId);
            };
            
            // 标签
            const label = document.createElement('span');
            label.className = 'tree-label';
            label.textContent = `${node.name} (${node.code})`;
            label.onclick = function(e) {
                if (e.target !== checkbox) {
                    checkbox.checked = !checkbox.checked;
                    handleCheckboxChange(node.id, checkbox.checked, containerId);
                }
            };
            
            contentDiv.appendChild(toggleSpan);
            contentDiv.appendChild(checkbox);
            contentDiv.appendChild(label);
            
            nodeDiv.appendChild(contentDiv);
            
            // 子节点
            if (hasChildren) {
                const childrenDiv = document.createElement('div');
                childrenDiv.className = 'tree-children';
                node.children.forEach(child => {
                    childrenDiv.appendChild(renderMultiSelectTreeNode(child, level + 1, containerId, selectedIds));
                });
                nodeDiv.appendChild(childrenDiv);
            }
            
            return nodeDiv;
        }
        
        // 切换树节点展开/折叠
        function toggleTreeNode(nodeDiv) {
            const children = nodeDiv.querySelector('.tree-children');
            const toggle = nodeDiv.querySelector('.tree-toggle');
            if (children) {
                children.classList.toggle('expanded');
                toggle.textContent = children.classList.contains('expanded') ? '▼' : '▶';
            }
        }
        
        // 处理复选框变化（父子联动）
        function handleCheckboxChange(permissionId, checked, containerId) {
            const container = document.getElementById(containerId);
            if (!container) return;
            
            // 如果选中，需要选中所有父节点
            if (checked) {
                const parentIds = getAllParentIds(permissionId, allPermissions);
                parentIds.forEach(parentId => {
                    const parentCheckbox = container.querySelector(`input[type="checkbox"][value="${parentId}"]`);
                    if (parentCheckbox && !parentCheckbox.checked) {
                        parentCheckbox.checked = true;
                    }
                });
            } else {
                // 如果取消选中，需要取消选中所有子节点
                const descendantIds = getAllDescendantIdsFromList(permissionId, allPermissions);
                descendantIds.forEach(descendantId => {
                    const descendantCheckbox = container.querySelector(`input[type="checkbox"][value="${descendantId}"]`);
                    if (descendantCheckbox && descendantCheckbox.checked) {
                        descendantCheckbox.checked = false;
                    }
                });
            }
        }
        
        // 获取容器中所有选中的权限ID
        function getSelectedPermissionIds(containerId) {
            const container = document.getElementById(containerId);
            if (!container) return [];
            
            const checkboxes = container.querySelectorAll('input[type="checkbox"]:checked');
            return Array.from(checkboxes).map(cb => cb.value);
        }
        
        // 查看操作
        function handleView(userId, domain) {
            const modal = document.getElementById('viewModal');
            document.getElementById('viewUserId').value = userId;
            document.getElementById('viewDomain').value = domain;
            document.getElementById('viewDomainDisplay').value = domain;
            
            // 获取该用户已拥有的权限
            const userPermissionIds = userPermissions[userId] || [];
            
            // 只显示该域下已拥有的权限
            const domainPermissionIds = allPermissions
                .filter(p => p.domain === domain)
                .map(p => p.id);
            const ownedPermissionIds = userPermissionIds.filter(id => domainPermissionIds.includes(id));
            
            const treeContainer = document.getElementById('viewPermissionTree');
            
            if (ownedPermissionIds.length === 0) {
                treeContainer.innerHTML = '<div style="padding: 20px; text-align: center; color: #999;">该域下暂无已赋权的权限</div>';
            } else {
                // 构建权限树（只显示已拥有的权限）
                const tree = buildPermissionTree(domain, ownedPermissionIds);
                treeContainer.innerHTML = '';
                
                if (tree.length > 0) {
                    tree.forEach(rootNode => {
                        // 使用只读权限树渲染，全部展开
                        treeContainer.appendChild(renderReadonlyTreeNode(rootNode, 0));
                    });
                } else {
                    treeContainer.innerHTML = '<div style="padding: 20px; text-align: center; color: #999;">该域下暂无已赋权的权限</div>';
                }
            }
            
            modal.classList.add('show');
        }
        
        // 关闭查看弹窗
        function closeViewModal() {
            const modal = document.getElementById('viewModal');
            modal.classList.remove('show');
            document.getElementById('viewUserId').value = '';
            document.getElementById('viewDomain').value = '';
            document.getElementById('viewDomainDisplay').value = '';
        }
        
        // 赋予操作
        function handleGrant(userId, domain) {
            const modal = document.getElementById('grantModal');
            document.getElementById('grantUserId').value = userId;
            document.getElementById('grantDomain').value = domain;
            document.getElementById('grantDomainDisplay').value = domain;
            
            // 获取该用户已拥有的权限（用于预选中）
            const userPermissionIds = userPermissions[userId] || [];
            
            // 构建权限树
            const tree = buildPermissionTree(domain);
            const treeContainer = document.getElementById('grantPermissionTree');
            treeContainer.innerHTML = '';
            
            if (tree.length > 0) {
                // 只显示该域下的权限，并预选中已拥有的权限
                const domainPermissionIds = allPermissions
                    .filter(p => p.domain === domain)
                    .map(p => p.id);
                const selectedIds = userPermissionIds.filter(id => domainPermissionIds.includes(id));
                
                tree.forEach(rootNode => {
                    treeContainer.appendChild(renderMultiSelectTreeNode(rootNode, 0, 'grantPermissionTree', selectedIds));
                });
            } else {
                treeContainer.innerHTML = '<div style="padding: 20px; text-align: center; color: #999;">该域下暂无权限数据</div>';
            }
            
            modal.classList.add('show');
        }
        
        // 提交赋权
        function handleSubmitGrant(event) {
            event.preventDefault();
            
            const userId = document.getElementById('grantUserId').value;
            const domain = document.getElementById('grantDomain').value;
            const selectedIds = getSelectedPermissionIds('grantPermissionTree');
            
            if (!userId || !domain) {
                alert('参数错误');
                return;
            }
            
            if (selectedIds.length === 0) {
                alert('请至少选择一个权限');
                return;
            }
            
            // 保存用户权限
            if (!userPermissions[userId]) {
                userPermissions[userId] = [];
            }
            
            // 合并权限（去重）
            const domainPermissionIds = allPermissions
                .filter(p => p.domain === domain)
                .map(p => p.id);
            
            // 移除该域下原有的权限
            userPermissions[userId] = userPermissions[userId].filter(id => !domainPermissionIds.includes(id));
            
            // 添加新选中的权限
            userPermissions[userId] = [...userPermissions[userId], ...selectedIds];
            
            closeGrantModal();
            alert('赋权成功');
            
            // 刷新表格
            renderTable(userId);
        }
        
        // 关闭赋权弹窗
        function closeGrantModal() {
            const modal = document.getElementById('grantModal');
            modal.classList.remove('show');
            document.getElementById('grantForm').reset();
            document.getElementById('grantUserId').value = '';
            document.getElementById('grantDomain').value = '';
            document.getElementById('grantDomainDisplay').value = '';
        }
        
        // 移除操作
        function handleRemove(userId, domain) {
            const modal = document.getElementById('removeModal');
            document.getElementById('removeUserId').value = userId;
            document.getElementById('removeDomain').value = domain;
            document.getElementById('removeDomainDisplay').value = domain;
            
            // 获取该用户已拥有的权限
            const userPermissionIds = userPermissions[userId] || [];
            
            // 只显示该域下已拥有的权限
            const domainPermissionIds = allPermissions
                .filter(p => p.domain === domain)
                .map(p => p.id);
            const ownedPermissionIds = userPermissionIds.filter(id => domainPermissionIds.includes(id));
            
            const treeContainer = document.getElementById('removePermissionTree');
            
            if (ownedPermissionIds.length === 0) {
                treeContainer.innerHTML = '<div style="padding: 20px; text-align: center; color: #999;">该域下暂无已赋权的权限</div>';
            } else {
                // 构建权限树（只显示已拥有的权限）
                const tree = buildPermissionTree(domain, ownedPermissionIds);
                treeContainer.innerHTML = '';
                
                if (tree.length > 0) {
                    // 预选中所有已拥有的权限
                    tree.forEach(rootNode => {
                        treeContainer.appendChild(renderMultiSelectTreeNode(rootNode, 0, 'removePermissionTree', ownedPermissionIds));
                    });
                } else {
                    treeContainer.innerHTML = '<div style="padding: 20px; text-align: center; color: #999;">该域下暂无已赋权的权限</div>';
                }
            }
            
            modal.classList.add('show');
        }
        
        // 提交移除
        function handleSubmitRemove(event) {
            event.preventDefault();
            
            const userId = document.getElementById('removeUserId').value;
            const domain = document.getElementById('removeDomain').value;
            const selectedIds = getSelectedPermissionIds('removePermissionTree');
            
            if (!userId || !domain) {
                alert('参数错误');
                return;
            }
            
            if (selectedIds.length === 0) {
                alert('请至少选择一个权限');
                return;
            }
            
            // 移除选中的权限
            if (userPermissions[userId]) {
                userPermissions[userId] = userPermissions[userId].filter(id => !selectedIds.includes(id));
            }
            
            closeRemoveModal();
            alert('移除权限成功');
            
            // 刷新表格
            renderTable(userId);
        }
        
        // 关闭移除弹窗
        function closeRemoveModal() {
            const modal = document.getElementById('removeModal');
            modal.classList.remove('show');
            document.getElementById('removeForm').reset();
            document.getElementById('removeUserId').value = '';
            document.getElementById('removeDomain').value = '';
            document.getElementById('removeDomainDisplay').value = '';
        }
        
        // 初始化
        function init() {
            const userId = getUserIdFromUrl();
            
            if (!userId) {
                alert('缺少用户ID参数');
                window.location.href = 'user-management.html';
                return;
            }
            
            renderUserInfo(userId);
            renderTable(userId);
        }
        
        // 页面加载时初始化
        init();
    </script>
</body>
</html>
