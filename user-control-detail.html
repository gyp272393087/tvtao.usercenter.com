<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户权控明细</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            padding: 24px;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        
        h1 {
            font-size: 24px;
            color: #333;
            font-weight: 500;
        }
        
        .btn-back {
            padding: 8px 20px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            background: white;
            color: #666;
            text-decoration: none;
            transition: all 0.3s;
        }
        
        .btn-back:hover {
            border-color: #1890ff;
            color: #1890ff;
        }
        
        .user-info {
            background: #fafafa;
            padding: 16px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 14px;
            color: #666;
        }
        
        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
            border-bottom: 1px solid #e8e8e8;
        }
        
        .tab {
            padding: 12px 24px;
            font-size: 14px;
            color: #666;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.3s;
            background: none;
            border: none;
            border-bottom: 2px solid transparent;
        }
        
        .tab:hover {
            color: #1890ff;
        }
        
        .tab.active {
            color: #1890ff;
            border-bottom-color: #1890ff;
            font-weight: 500;
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
        }
        
        .table-section {
            overflow-x: auto;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        
        thead {
            background: #fafafa;
        }
        
        th {
            padding: 12px;
            text-align: left;
            font-weight: 500;
            color: #333;
            border-bottom: 1px solid #e8e8e8;
        }
        
        td {
            padding: 12px;
            border-bottom: 1px solid #f0f0f0;
            color: #666;
        }
        
        tbody tr:hover {
            background: #fafafa;
        }
        
        .empty-state {
            text-align: center;
            padding: 40px;
            color: #999;
        }
        
        .operation-buttons {
            display: flex;
            gap: 8px;
        }
        
        .btn-action {
            padding: 4px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            background: white;
            color: #666;
            transition: all 0.3s;
        }
        
        .btn-action:hover {
            border-color: #1890ff;
            color: #1890ff;
        }
        
        .btn-view {
            color: #1890ff;
        }
        
        .btn-view:hover {
            background: #e6f7ff;
            border-color: #1890ff;
        }
        
        .btn-add {
            color: #52c41a;
        }
        
        .btn-add:hover {
            background: #f6ffed;
            border-color: #52c41a;
        }
        
        .btn-delete {
            color: #ff4d4f;
        }
        
        .btn-delete:hover {
            background: #fff1f0;
            border-color: #ff4d4f;
        }
        
        .btn-grant {
            color: #52c41a;
        }
        
        .btn-grant:hover {
            background: #f6ffed;
            border-color: #52c41a;
        }
        
        .btn-remove {
            color: #ff4d4f;
        }
        
        .btn-remove:hover {
            background: #fff1f0;
            border-color: #ff4d4f;
        }
        
        /* 弹窗样式 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        
        .modal.show {
            display: flex;
        }
        
        .modal-content {
            background: white;
            border-radius: 8px;
            padding: 24px;
            width: 90%;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .modal-title {
            font-size: 18px;
            font-weight: 500;
            color: #333;
        }
        
        .modal-close {
            background: none;
            border: none;
            font-size: 24px;
            color: #999;
            cursor: pointer;
            padding: 0;
            width: 24px;
            height: 24px;
            line-height: 24px;
        }
        
        .modal-close:hover {
            color: #333;
        }
        
        .modal-form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        
        .form-item {
            display: flex;
            flex-direction: column;
        }
        
        .form-item label {
            font-size: 14px;
            color: #666;
            margin-bottom: 6px;
        }
        
        .form-item input,
        .form-item select {
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }
        
        .form-item input:focus,
        .form-item select:focus {
            outline: none;
            border-color: #1890ff;
        }
        
        .form-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 8px;
        }
        
        .btn {
            padding: 8px 20px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-primary {
            background: #1890ff;
            color: white;
        }
        
        .btn-primary:hover {
            background: #40a9ff;
        }
        
        .btn-reset {
            background: #fff;
            color: #666;
            border: 1px solid #ddd;
        }
        
        .btn-reset:hover {
            border-color: #1890ff;
            color: #1890ff;
        }
        
        /* 权限树样式 */
        .permission-tree {
            border: 1px solid #ddd;
            border-radius: 4px;
            max-height: 400px;
            overflow-y: auto;
            padding: 8px;
            background: #fafafa;
        }
        
        .tree-node {
            margin: 4px 0;
        }
        
        .tree-node-content {
            display: flex;
            align-items: center;
            padding: 4px 8px;
            cursor: pointer;
            border-radius: 4px;
            transition: background 0.2s;
        }
        
        .tree-node-content:hover {
            background: #e6f7ff;
        }
        
        .tree-toggle {
            width: 16px;
            height: 16px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-right: 4px;
            cursor: pointer;
            color: #666;
            font-size: 12px;
        }
        
        .tree-toggle:hover {
            color: #1890ff;
        }
        
        .tree-checkbox {
            margin-right: 6px;
            cursor: pointer;
        }
        
        .tree-label {
            flex: 1;
            font-size: 14px;
            color: #333;
        }
        
        .tree-children {
            margin-left: 20px;
            display: none;
        }
        
        .tree-children.expanded {
            display: block;
        }
        
        .tree-node.leaf .tree-toggle {
            visibility: hidden;
        }
        
        /* 只读权限树样式 */
        .permission-tree.readonly .tree-checkbox {
            display: none;
        }
        
        .permission-tree.readonly .tree-node-content {
            cursor: default;
        }
        
        .permission-tree.readonly .tree-node-content:hover {
            background: transparent;
        }
        
        .permission-tree.readonly .tree-children {
            display: block;
        }
        
        .permission-tree.readonly .tree-toggle {
            visibility: hidden;
        }
    </style>
</head>

        // 构建权限树结构
        function buildPermissionTree(domain = null, permissionIds = null) {
            // 根据域过滤权限
            let filteredPermissions = domain 
                ? allPermissions.filter(p => p.domain === domain)
                : allPermissions;
            
            // 如果指定了权限ID列表，只显示这些权限
            if (permissionIds && permissionIds.length > 0) {
                filteredPermissions = filteredPermissions.filter(p => permissionIds.includes(p.id));
            }
            
            if (filteredPermissions.length === 0) {
                return [];
            }
            
            // 创建权限映射
            const permissionMap = {};
            filteredPermissions.forEach(p => {
                permissionMap[p.id] = { ...p, children: [] };
            });
            
            // 构建树结构
            const rootNodes = [];
            filteredPermissions.forEach(p => {
                const node = permissionMap[p.id];
                if (p.parentId && permissionMap[p.parentId]) {
                    permissionMap[p.parentId].children.push(node);
                } else {
                    rootNodes.push(node);
                }
            });
            
            return rootNodes;
        }
        
        // 获取节点的所有后代ID
        function getAllDescendantIds(node) {
            const ids = [];
            if (node.children && node.children.length > 0) {
                node.children.forEach(child => {
                    ids.push(child.id);
                    ids.push(...getAllDescendantIds(child));
                });
            }
            return ids;
        }
        
        // 从权限列表中查找节点并获取所有后代ID
        function getAllDescendantIdsFromList(permissionId, allPermissions) {
            const permission = allPermissions.find(p => p.id === permissionId);
            if (!permission) return [];
            
            const permissionMap = {};
            allPermissions.forEach(p => {
                permissionMap[p.id] = { ...p, children: [] };
            });
            
            allPermissions.forEach(p => {
                if (p.parentId && permissionMap[p.parentId]) {
                    permissionMap[p.parentId].children.push(permissionMap[p.id]);
                }
            });
            
            const node = permissionMap[permissionId];
            if (!node) return [];
            
            return getAllDescendantIds(node);
        }
        
        // 获取节点的所有父节点ID
        function getAllParentIds(permissionId, allPermissions) {
            const ids = [];
            let current = allPermissions.find(p => p.id === permissionId);
            while (current && current.parentId) {
                ids.push(current.parentId);
                current = allPermissions.find(p => p.id === current.parentId);
            }
            return ids;
        }
        
        // 渲染只读权限树节点（全部展开，不可选中）
        function renderReadonlyTreeNode(node, level = 0) {
            const hasChildren = node.children && node.children.length > 0;
            const nodeDiv = document.createElement('div');
            nodeDiv.className = 'tree-node' + (hasChildren ? '' : ' leaf');
            nodeDiv.dataset.nodeId = node.id;
            
            const contentDiv = document.createElement('div');
            contentDiv.className = 'tree-node-content';
            
            // 展开/折叠按钮（隐藏，因为只读模式下全部展开）
            const toggleSpan = document.createElement('span');
            toggleSpan.className = 'tree-toggle';
            toggleSpan.style.visibility = 'hidden';
            
            // 标签
            const label = document.createElement('span');
            label.className = 'tree-label';
            label.textContent = `${node.name} (${node.code})`;
            
            contentDiv.appendChild(toggleSpan);
            contentDiv.appendChild(label);
            
            nodeDiv.appendChild(contentDiv);
            
            // 子节点（默认展开）
            if (hasChildren) {
                const childrenDiv = document.createElement('div');
                childrenDiv.className = 'tree-children expanded';
                node.children.forEach(child => {
                    childrenDiv.appendChild(renderReadonlyTreeNode(child, level + 1));
                });
                nodeDiv.appendChild(childrenDiv);
            }
            
            return nodeDiv;
        }
        
        // 渲染多选权限树节点
        function renderMultiSelectTreeNode(node, level = 0, containerId, selectedIds = [], disabledIds = []) {
            const hasChildren = node.children && node.children.length > 0;
            const nodeDiv = document.createElement('div');
            nodeDiv.className = 'tree-node' + (hasChildren ? '' : ' leaf');
            nodeDiv.dataset.nodeId = node.id;
            
            const isChecked = selectedIds.includes(node.id);
            const isDisabled = disabledIds.includes(node.id);
            
            const contentDiv = document.createElement('div');
            contentDiv.className = 'tree-node-content';
            
            // 展开/折叠按钮
            const toggleSpan = document.createElement('span');
            toggleSpan.className = 'tree-toggle';
            if (hasChildren) {
                toggleSpan.textContent = '▶';
                toggleSpan.onclick = function(e) {
                    e.stopPropagation();
                    toggleTreeNode(nodeDiv);
                };
            }
            
            // 多选框
            const checkbox = document.createElement('input');
            checkbox.type = 'checkbox';
            checkbox.className = 'tree-checkbox';
            checkbox.value = node.id;
            checkbox.checked = isChecked;
            checkbox.disabled = isDisabled;
            if (!isDisabled) {
                checkbox.onclick = function(e) {
                    e.stopPropagation();
                    handleCheckboxChange(node.id, checkbox.checked, containerId);
                };
            }
            
            // 标签
            const label = document.createElement('span');
            label.className = 'tree-label';
            label.textContent = `${node.name} (${node.code})`;
            if (!isDisabled) {
                label.onclick = function(e) {
                    if (e.target !== checkbox) {
                        checkbox.checked = !checkbox.checked;
                        handleCheckboxChange(node.id, checkbox.checked, containerId);
                    }
                };
            }
            
            contentDiv.appendChild(toggleSpan);
            contentDiv.appendChild(checkbox);
            contentDiv.appendChild(label);
            
            nodeDiv.appendChild(contentDiv);
            
            // 子节点
            if (hasChildren) {
                const childrenDiv = document.createElement('div');
                childrenDiv.className = 'tree-children';
                node.children.forEach(child => {
                    childrenDiv.appendChild(renderMultiSelectTreeNode(child, level + 1, containerId, selectedIds, disabledIds));
                });
                nodeDiv.appendChild(childrenDiv);
            }
            
            return nodeDiv;
        }
        
        // 切换树节点展开/折叠
        function toggleTreeNode(nodeDiv) {
            const children = nodeDiv.querySelector('.tree-children');
            const toggle = nodeDiv.querySelector('.tree-toggle');
            if (children) {
                children.classList.toggle('expanded');
                toggle.textContent = children.classList.contains('expanded') ? '▼' : '▶';
            }
        }
        
        // 处理复选框变化（父子联动）
        function handleCheckboxChange(permissionId, checked, containerId) {
            const container = document.getElementById(containerId);
            if (!container) return;
            
            // 如果选中，需要选中所有父节点
            if (checked) {
                const parentIds = getAllParentIds(permissionId, allPermissions);
                parentIds.forEach(parentId => {
                    const parentCheckbox = container.querySelector(`input[type="checkbox"][value="${parentId}"]`);
                    if (parentCheckbox && !parentCheckbox.checked) {
                        parentCheckbox.checked = true;
                    }
                });
            } else {
                // 如果取消选中，需要取消选中所有子节点
                const descendantIds = getAllDescendantIdsFromList(permissionId, allPermissions);
                descendantIds.forEach(descendantId => {
                    const descendantCheckbox = container.querySelector(`input[type="checkbox"][value="${descendantId}"]`);
                    if (descendantCheckbox && descendantCheckbox.checked) {
                        descendantCheckbox.checked = false;
                    }
                });
            }
        }
        
        // 获取容器中所有选中的权限ID
        function getSelectedPermissionIds(containerId) {
            const container = document.getElementById(containerId);
            if (!container) return [];
            
            const checkboxes = container.querySelectorAll('input[type="checkbox"]:checked');
            return Array.from(checkboxes).map(cb => cb.value);
        }

        // 构建资源树结构
        function buildResourceTree(domain = null, resourceIds = null) {
            // 根据域过滤资源
            let filteredResources = domain 
                ? allResources.filter(r => r.domain === domain)
                : allResources;
            
            // 如果指定了资源ID列表，只显示这些资源
            if (resourceIds && resourceIds.length > 0) {
                filteredResources = filteredResources.filter(r => resourceIds.includes(r.id));
            }
            
            if (filteredResources.length === 0) {
                return [];
            }
            
            // 创建资源映射
            const resourceMap = {};
            filteredResources.forEach(r => {
                resourceMap[r.id] = { ...r, children: [] };
            });
            
            // 构建树结构
            const rootNodes = [];
            filteredResources.forEach(r => {
                const node = resourceMap[r.id];
                if (r.parentId && resourceMap[r.parentId]) {
                    resourceMap[r.parentId].children.push(node);
                } else {
                    rootNodes.push(node);
                }
            });
            
            return rootNodes;
        }
        
        // 渲染多选资源树节点
        function renderMultiSelectResourceTreeNode(node, level = 0, containerId, selectedIds = [], disabledIds = []) {
            const hasChildren = node.children && node.children.length > 0;
            const nodeDiv = document.createElement('div');
            nodeDiv.className = 'tree-node' + (hasChildren ? '' : ' leaf');
            nodeDiv.dataset.nodeId = node.id;
            
            const isChecked = selectedIds.includes(node.id);
            const isDisabled = disabledIds.includes(node.id);
            
            const contentDiv = document.createElement('div');
            contentDiv.className = 'tree-node-content';
            
            // 展开/折叠按钮
            const toggleSpan = document.createElement('span');
            toggleSpan.className = 'tree-toggle';
            if (hasChildren) {
                toggleSpan.textContent = '▶';
                toggleSpan.onclick = function(e) {
                    e.stopPropagation();
                    toggleResourceTreeNode(nodeDiv);
                };
            }
            
            // 多选框
            const checkbox = document.createElement('input');
            checkbox.type = 'checkbox';
            checkbox.className = 'tree-checkbox';
            checkbox.value = node.id;
            checkbox.checked = isChecked;
            checkbox.disabled = isDisabled;
            if (!isDisabled) {
                checkbox.onclick = function(e) {
                    e.stopPropagation();
                    handleResourceCheckboxChange(node.id, checkbox.checked, containerId);
                };
            }
            
            // 标签
            const label = document.createElement('span');
            label.className = 'tree-label';
            label.textContent = `${node.name} (${node.code})`;
            if (!isDisabled) {
                label.onclick = function(e) {
                    if (e.target !== checkbox) {
                        checkbox.checked = !checkbox.checked;
                        handleResourceCheckboxChange(node.id, checkbox.checked, containerId);
                    }
                };
            }
            
            contentDiv.appendChild(toggleSpan);
            contentDiv.appendChild(checkbox);
            contentDiv.appendChild(label);
            
            nodeDiv.appendChild(contentDiv);
            
            // 子节点
            if (hasChildren) {
                const childrenDiv = document.createElement('div');
                childrenDiv.className = 'tree-children';
                node.children.forEach(child => {
                    childrenDiv.appendChild(renderMultiSelectResourceTreeNode(child, level + 1, containerId, selectedIds, disabledIds));
                });
                nodeDiv.appendChild(childrenDiv);
            }
            
            return nodeDiv;
        }
        
        // 渲染只读资源树节点（不可选中，默认全部展开）
        function renderReadOnlyResourceTreeNode(node, level = 0, selectedIds = []) {
            const hasChildren = node.children && node.children.length > 0;
            const nodeDiv = document.createElement('div');
            nodeDiv.className = 'tree-node' + (hasChildren ? '' : ' leaf');
            nodeDiv.dataset.nodeId = node.id;
            
            const isChecked = selectedIds.includes(node.id);
            
            const contentDiv = document.createElement('div');
            contentDiv.className = 'tree-node-content readonly';
            
            // 展开/折叠按钮（默认展开）
            const toggleSpan = document.createElement('span');
            toggleSpan.className = 'tree-toggle';
            if (hasChildren) {
                toggleSpan.textContent = '▼';
                toggleSpan.onclick = function(e) {
                    e.stopPropagation();
                    toggleResourceTreeNode(nodeDiv);
                };
            }
            
            // 多选框（禁用状态）
            const checkbox = document.createElement('input');
            checkbox.type = 'checkbox';
            checkbox.className = 'tree-checkbox';
            checkbox.value = node.id;
            checkbox.checked = isChecked;
            checkbox.disabled = true;
            
            // 标签
            const label = document.createElement('span');
            label.className = 'tree-label';
            label.textContent = `${node.name} (${node.code})`;
            
            contentDiv.appendChild(toggleSpan);
            contentDiv.appendChild(checkbox);
            contentDiv.appendChild(label);
            
            nodeDiv.appendChild(contentDiv);
            
            // 子节点（默认展开）
            if (hasChildren) {
                const childrenDiv = document.createElement('div');
                childrenDiv.className = 'tree-children expanded';
                node.children.forEach(child => {
                    childrenDiv.appendChild(renderReadOnlyResourceTreeNode(child, level + 1, selectedIds));
                });
                nodeDiv.appendChild(childrenDiv);
            }
            
            return nodeDiv;
        }
        
        // 切换资源树节点展开/折叠
        function toggleResourceTreeNode(nodeDiv) {
            const children = nodeDiv.querySelector('.tree-children');
            const toggle = nodeDiv.querySelector('.tree-toggle');
            if (children) {
                children.classList.toggle('expanded');
                toggle.textContent = children.classList.contains('expanded') ? '▼' : '▶';
            }
        }
        
        // 处理资源复选框变化（单独选择，不联动）
        function handleResourceCheckboxChange(resourceId, checked, containerId) {
            // 单独选择，不进行父子联动
        }
        
        // 获取容器中所有选中的资源ID
        function getSelectedResourceIds(containerId) {
            const container = document.getElementById(containerId);
            if (!container) return [];
            
            const checkboxes = container.querySelectorAll('input[type="checkbox"]:checked');
            return Array.from(checkboxes).map(cb => cb.value);
        }
        
        // 查看资源操作
        function handleViewResource(userId, domain) {
            const modal = document.getElementById('viewResourceModal');
            document.getElementById('viewResourceUserId').value = userId;
            document.getElementById('viewResourceDomain').value = domain;
            
            // 获取该用户已拥有的资源
            const userResourceIds = userResources[userId] || [];
            
            // 只显示该域下已拥有的资源
            const domainResourceIds = allResources
                .filter(r => r.domain === domain)
                .map(r => r.id);
            const ownedResourceIds = userResourceIds.filter(id => domainResourceIds.includes(id));
            
            if (ownedResourceIds.length === 0) {
                const treeContainer = document.getElementById('viewResourceTree');
                treeContainer.innerHTML = '<div style="padding: 20px; text-align: center; color: #999;">该域下暂无已赋资源的资源</div>';
                modal.classList.add('show');
                return;
            }
            
            // 构建资源树（只显示已拥有的资源，使用只读模式）
            const tree = buildResourceTree(domain, ownedResourceIds);
            const treeContainer = document.getElementById('viewResourceTree');
            treeContainer.innerHTML = '';
            
            if (tree.length > 0) {
                tree.forEach(rootNode => {
                    // 使用只读树渲染，显示已拥有的资源，默认全部展开
                    treeContainer.appendChild(renderReadOnlyResourceTreeNode(rootNode, 0, ownedResourceIds));
                });
            } else {
                treeContainer.innerHTML = '<div style="padding: 20px; text-align: center; color: #999;">该域下暂无已赋资源的资源</div>';
            }
            
            modal.classList.add('show');
        }
        
        // 关闭查看资源弹窗
        function closeViewResourceModal() {
            const modal = document.getElementById('viewResourceModal');
            modal.classList.remove('show');
            document.getElementById('viewResourceDomain').value = '';
            document.getElementById('viewResourceUserId').value = '';
        }
        
        // 赋资源操作
        function handleGrantResource(userId, domain) {
            const modal = document.getElementById('grantResourceModal');
            document.getElementById('grantResourceUserId').value = userId;
            document.getElementById('grantResourceDomain').value = domain;
            
            // 获取该用户已拥有的资源（用于预选中）
            const userResourceIds = userResources[userId] || [];
            
            // 构建资源树
            const tree = buildResourceTree(domain);
            const treeContainer = document.getElementById('grantResourceTree');
            treeContainer.innerHTML = '';
            
            if (tree.length > 0) {
                tree.forEach(rootNode => {
                    // 只显示该域下的资源，并预选中已拥有的资源，同时禁用这些已拥有的资源
                    const domainResourceIds = allResources
                        .filter(r => r.domain === domain)
                        .map(r => r.id);
                    const selectedIds = userResourceIds.filter(id => domainResourceIds.includes(id));
                    treeContainer.appendChild(renderMultiSelectResourceTreeNode(rootNode, 0, 'grantResourceTree', selectedIds, selectedIds));
                });
            } else {
                treeContainer.innerHTML = '<div style="padding: 20px; text-align: center; color: #999;">该域下暂无资源数据</div>';
            }
            
            modal.classList.add('show');
        }
        
        // 提交赋资源
        function handleSubmitGrantResource(event) {
            event.preventDefault();
            
            const userId = document.getElementById('grantResourceUserId').value;
            const domain = document.getElementById('grantResourceDomain').value;
            const selectedIds = getSelectedResourceIds('grantResourceTree');
            
            if (!userId || !domain) {
                alert('缺少必要参数');
                return;
            }
            
            if (selectedIds.length === 0) {
                alert('请至少选择一个资源');
                return;
            }
            
            // 保存用户资源
            if (!userResources[userId]) {
                userResources[userId] = [];
            }
            
            // 合并资源（去重）
            const domainResourceIds = allResources
                .filter(r => r.domain === domain)
                .map(r => r.id);
            
            // 移除该域下原有的资源
            userResources[userId] = userResources[userId].filter(id => !domainResourceIds.includes(id));
            
            // 添加新选中的资源
            userResources[userId] = [...userResources[userId], ...selectedIds];
            
            closeGrantResourceModal();
            alert('赋资源成功');
            // 刷新表格
            renderResourceTable();
        }
        
        // 关闭赋资源弹窗
        function closeGrantResourceModal() {
            const modal = document.getElementById('grantResourceModal');
            modal.classList.remove('show');
            document.getElementById('grantResourceForm').reset();
            document.getElementById('grantResourceUserId').value = '';
            document.getElementById('grantResourceDomain').value = '';
        }
        
        // 除资源操作
        function handleRevokeResource(userId, domain) {
            const modal = document.getElementById('revokeResourceModal');
            document.getElementById('revokeResourceUserId').value = userId;
            document.getElementById('revokeResourceDomain').value = domain;
            
            // 获取该用户已拥有的资源
            const userResourceIds = userResources[userId] || [];
            
            // 只显示该域下已拥有的资源
            const domainResourceIds = allResources
                .filter(r => r.domain === domain)
                .map(r => r.id);
            const ownedResourceIds = userResourceIds.filter(id => domainResourceIds.includes(id));
            
            if (ownedResourceIds.length === 0) {
                const treeContainer = document.getElementById('revokeResourceTree');
                treeContainer.innerHTML = '<div style="padding: 20px; text-align: center; color: #999;">该域下暂无已赋资源的资源</div>';
                modal.classList.add('show');
                return;
            }
            
            // 构建资源树（只显示已拥有的资源）
            const tree = buildResourceTree(domain, ownedResourceIds);
            const treeContainer = document.getElementById('revokeResourceTree');
            treeContainer.innerHTML = '';
            
            if (tree.length > 0) {
                tree.forEach(rootNode => {
                    // 默认不选中，等待用户手动选择需移除的资源
                    treeContainer.appendChild(renderMultiSelectResourceTreeNode(rootNode, 0, 'revokeResourceTree'));
                });
            } else {
                treeContainer.innerHTML = '<div style="padding: 20px; text-align: center; color: #999;">该域下暂无已赋资源的资源</div>';
            }
            
            modal.classList.add('show');
        }
        
        // 提交除资源
        function handleSubmitRevokeResource(event) {
            event.preventDefault();
            
            const userId = document.getElementById('revokeResourceUserId').value;
            const domain = document.getElementById('revokeResourceDomain').value;
            const selectedIds = getSelectedResourceIds('revokeResourceTree');
            
            if (!userId || !domain) {
                alert('缺少必要参数');
                return;
            }
            
            if (selectedIds.length === 0) {
                alert('请至少选择一个资源');
                return;
            }
            
            // 移除选中的资源
            if (userResources[userId]) {
                userResources[userId] = userResources[userId].filter(id => !selectedIds.includes(id));
            }
            
            closeRevokeResourceModal();
            alert('除资源成功');
            // 刷新表格
            renderResourceTable();
        }
        
        // 关闭除资源弹窗
        function closeRevokeResourceModal() {
            const modal = document.getElementById('revokeResourceModal');
            modal.classList.remove('show');
            document.getElementById('revokeResourceForm').reset();
            document.getElementById('revokeResourceUserId').value = '';
            document.getElementById('revokeResourceDomain').value = '';
        }
        
        // 初始化
        function init() {
            const userId = getUserIdFromUrl();
            
            if (!userId) {
                alert('缺少用户ID参数');
                window.location.href = 'user-management.html';
                return;
            }
            
            renderUserInfo(userId);
            renderPermissionTable();
            renderRoleTable();
            renderResourceTable();
        }
        
        // 页面加载时初始化
        init();
    </script>
</body>
