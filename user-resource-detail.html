<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户资源详情</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            padding: 24px;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        
        h1 {
            font-size: 24px;
            color: #333;
            font-weight: 500;
        }
        
        .btn-back {
            padding: 8px 20px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            background: white;
            color: #666;
            text-decoration: none;
            transition: all 0.3s;
        }
        
        .btn-back:hover {
            border-color: #1890ff;
            color: #1890ff;
        }
        
        .user-info {
            background: #fafafa;
            padding: 16px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 14px;
            color: #666;
        }
        
        .table-section {
            overflow-x: auto;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        
        thead {
            background: #fafafa;
        }
        
        th {
            padding: 12px;
            text-align: left;
            font-weight: 500;
            color: #333;
            border-bottom: 1px solid #e8e8e8;
        }
        
        td {
            padding: 12px;
            border-bottom: 1px solid #f0f0f0;
            color: #666;
        }
        
        tbody tr:hover {
            background: #fafafa;
        }
        
        .empty-state {
            text-align: center;
            padding: 40px;
            color: #999;
        }
        
        .operation-buttons {
            display: flex;
            gap: 8px;
        }
        
        .btn-action {
            padding: 4px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            background: white;
            color: #666;
            transition: all 0.3s;
        }
        
        .btn-action:hover {
            border-color: #1890ff;
            color: #1890ff;
        }
        
        .btn-view {
            color: #1890ff;
        }
        
        .btn-view:hover {
            background: #e6f7ff;
            border-color: #1890ff;
        }
        
        .btn-grant {
            color: #52c41a;
        }
        
        .btn-grant:hover {
            background: #f6ffed;
            border-color: #52c41a;
        }
        
        .btn-remove {
            color: #ff4d4f;
        }
        
        .btn-remove:hover {
            background: #fff1f0;
            border-color: #ff4d4f;
        }
        
        /* 弹窗样式 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        
        .modal.show {
            display: flex;
        }
        
        .modal-content {
            background: white;
            border-radius: 8px;
            padding: 24px;
            width: 90%;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .modal-title {
            font-size: 18px;
            font-weight: 500;
            color: #333;
        }
        
        .modal-close {
            background: none;
            border: none;
            font-size: 24px;
            color: #999;
            cursor: pointer;
            padding: 0;
            width: 24px;
            height: 24px;
            line-height: 24px;
        }
        
        .modal-close:hover {
            color: #333;
        }
        
        .modal-form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        
        .form-item {
            display: flex;
            flex-direction: column;
        }
        
        .form-item label {
            font-size: 14px;
            color: #666;
            margin-bottom: 6px;
        }
        
        .form-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 8px;
        }
        
        /* 资源树样式 */
        .resource-tree {
            border: 1px solid #ddd;
            border-radius: 4px;
            max-height: 400px;
            overflow-y: auto;
            padding: 8px;
            background: #fafafa;
        }
        
        .tree-node {
            margin: 4px 0;
        }
        
        .tree-node-content {
            display: flex;
            align-items: center;
            padding: 4px 8px;
            cursor: pointer;
            border-radius: 4px;
            transition: background 0.2s;
        }
        
        .tree-node-content:hover {
            background: #e6f7ff;
        }
        
        .tree-toggle {
            width: 16px;
            height: 16px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-right: 4px;
            cursor: pointer;
            color: #666;
            font-size: 12px;
        }
        
        .tree-toggle:hover {
            color: #1890ff;
        }
        
        .tree-checkbox {
            margin-right: 6px;
            cursor: pointer;
        }
        
        .tree-label {
            flex: 1;
            font-size: 14px;
            color: #333;
        }
        
        .tree-children {
            margin-left: 20px;
            display: none;
        }
        
        .tree-children.expanded {
            display: block;
        }
        
        .tree-node.leaf .tree-toggle {
            visibility: hidden;
        }
        
        .tree-checkbox:disabled {
            cursor: not-allowed;
            opacity: 0.5;
        }
        
        .tree-node-content.readonly {
            cursor: default;
        }
        
        .tree-node-content.readonly:hover {
            background: transparent;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>用户资源详情</h1>
            <a href="user-management.html" class="btn-back">返回</a>
        </div>
        
        <div class="user-info" id="userInfo">
            <!-- 用户信息将通过JavaScript动态生成 -->
        </div>
        
        <div class="table-section">
            <table>
                <thead>
                    <tr>
                        <th>域</th>
                        <th>资源总数</th>
                        <th>生效资源数量</th>
                        <th>审批中资源数量</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- 数据将通过JavaScript动态生成 -->
                </tbody>
            </table>
            <div id="emptyState" class="empty-state" style="display: none;">
                暂无数据
            </div>
        </div>
    </div>
    
    <!-- 赋资源弹窗 -->
    <div id="grantModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">赋资源</div>
                <button type="button" class="modal-close" onclick="closeGrantModal()">&times;</button>
            </div>
            <form class="modal-form" id="grantForm" onsubmit="handleSubmitGrant(event)">
                <input type="hidden" id="grantUserId" value="">
                <input type="hidden" id="grantDomain" value="">
                <div class="form-item">
                    <label>选择资源</label>
                    <div class="resource-tree" id="grantresourceTree">
                        <!-- 资源树将通过JavaScript动态生成 -->
                    </div>
                </div>
                <div class="form-buttons">
                    <button type="button" class="btn-back" onclick="closeGrantModal()">取消</button>
                    <button type="submit" class="btn-action btn-grant">保存</button>
                </div>
            </form>
        </div>
    </div>
    
    <!-- 除资源弹窗 -->
    <div id="revokeModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">除资源</div>
                <button type="button" class="modal-close" onclick="closeRevokeModal()">&times;</button>
            </div>
            <form class="modal-form" id="revokeForm" onsubmit="handleSubmitRevoke(event)">
                <input type="hidden" id="revokeUserId" value="">
                <input type="hidden" id="revokeDomain" value="">
                <div class="form-item">
                    <label>选择资源</label>
                    <div class="resource-tree" id="revokeresourceTree">
                        <!-- 资源树将通过JavaScript动态生成 -->
                    </div>
                </div>
                <div class="form-buttons">
                    <button type="button" class="btn-back" onclick="closeRevokeModal()">取消</button>
                    <button type="submit" class="btn-action btn-remove">保存</button>
                </div>
            </form>
        </div>
    </div>
    
    <!-- 查看资源弹窗 -->
    <div id="viewModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">查看资源</div>
                <button type="button" class="modal-close" onclick="closeViewModal()">&times;</button>
            </div>
            <div class="modal-form">
                <input type="hidden" id="viewUserId" value="">
                <input type="hidden" id="viewDomain" value="">
                <div class="form-item">
                    <label>资源列表</label>
                    <div class="resource-tree" id="viewresourceTree">
                        <!-- 资源树将通过JavaScript动态生成 -->
                    </div>
                </div>
                <div class="form-buttons">
                    <button type="button" class="btn-back" onclick="closeViewModal()">关闭</button>
                </div>
            </div>
        </div>
    </div>

        ];
        
        // 用户-资源关联关系 { userId: [resourceId1, resourceId2, ...] }
        let userresources = {};
        
        // 用户资源关联关系 { userId: { domain: { total: number, active: number, pending: number } } }
        const userResourceStats = {
            '1': {
                '数据分析': { total: 3, active: 2, pending: 1 },
                '报表管理': { total: 2, active: 2, pending: 0 },
                '内容管理': { total: 2, active: 1, pending: 1 }

                '内容管理': { total: 2, active: 0, pending: 2 }
            },

            }
        };
        
        // 获取所有资源域
        function getAllDomains() {
            return [...new Set(allresources.map(r => r.domain))].sort();
        }
        
        // 渲染用户信息
        function renderUserInfo(userId) {
            const user = allUsers.find(u => u.id === userId);
            const userInfoDiv = document.getElementById('userInfo');
            
            if (user) {
                userInfoDiv.innerHTML = `
                    <strong>用户ID:</strong> ${user.id} | 
                    <strong>用户名称:</strong> ${user.name} | 
                    <strong>用户类型:</strong> ${user.type} | 
                    <strong>用户账号:</strong> ${user.account}
                `;
            } else {
                userInfoDiv.innerHTML = '<span style="color: #ff4d4f;">未找到用户信息</span>';
            }
        }
        
        // 渲染表格
        function renderTable(userId) {
            const tbody = document.getElementById('tableBody');
            const emptyState = document.getElementById('emptyState');
            
            const domains = getAllDomains();
            const stats = userResourceStats[userId] || {};
            
            if (domains.length === 0) {
                tbody.innerHTML = '';
                emptyState.style.display = 'block';
                return;
            }
            
            emptyState.style.display = 'none';
            tbody.innerHTML = domains.map(domain => {
                const domainStats = stats[domain] || { total: 0, active: 0, pending: 0 };
                return `
                    <tr>
                        <td>${domain}</td>
                        <td>${domainStats.total}</td>
                        <td>${domainStats.active}</td>
                        <td>${domainStats.pending}</td>
                        <td>
                            <div class="operation-buttons">
                                <button type="button" class="btn-action btn-view" onclick="handleView('${userId}', '${domain}')">查看</button>
                                <button type="button" class="btn-action btn-grant" onclick="handleGrant('${userId}', '${domain}')">赋资源</button>
                                <button type="button" class="btn-action btn-remove" onclick="handleRevoke('${userId}', '${domain}')">除资源</button>
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');
        }
        
        // 构建资源树结构
        function buildresourceTree(domain = null, resourceIds = null) {
            // 根据域过滤资源
            let filteredresources = domain 
                ? allresources.filter(p => p.domain === domain)
                : allresources;
            
            // 如果指定了资源ID列表，只显示这些资源
            if (resourceIds && resourceIds.length > 0) {
                filteredresources = filteredresources.filter(p => resourceIds.includes(p.id));
            }
            
            if (filteredresources.length === 0) {
                return [];
            }
            
            // 创建资源映射
            const resourceMap = {};
            filteredresources.forEach(p => {
                resourceMap[p.id] = { ...p, children: [] };
            });
            
            // 构建树结构
            const rootNodes = [];
            filteredresources.forEach(p => {
                const node = resourceMap[p.id];
                if (p.parentId && resourceMap[p.parentId]) {
                    resourceMap[p.parentId].children.push(node);
                } else {
                    rootNodes.push(node);
                }
            });
            
            return rootNodes;
        }
        
        // 渲染多选资源树节点
        function renderMultiSelectTreeNode(node, level = 0, containerId, selectedIds = []) {
            const hasChildren = node.children && node.children.length > 0;
            const nodeDiv = document.createElement('div');
            nodeDiv.className = 'tree-node' + (hasChildren ? '' : ' leaf');
            nodeDiv.dataset.nodeId = node.id;
            
            const isChecked = selectedIds.includes(node.id);
            
            const contentDiv = document.createElement('div');
            contentDiv.className = 'tree-node-content';
            
            // 展开/折叠按钮
            const toggleSpan = document.createElement('span');
            toggleSpan.className = 'tree-toggle';
            if (hasChildren) {
                toggleSpan.textContent = '▶';
                toggleSpan.onclick = function(e) {
                    e.stopPropagation();
                    toggleTreeNode(nodeDiv);
                };
            }
            
            // 多选框
            const checkbox = document.createElement('input');
            checkbox.type = 'checkbox';
            checkbox.className = 'tree-checkbox';
            checkbox.value = node.id;
            checkbox.checked = isChecked;
            checkbox.onclick = function(e) {
                e.stopPropagation();
                handleCheckboxChange(node.id, checkbox.checked, containerId);
            };
            
            // 标签
            const label = document.createElement('span');
            label.className = 'tree-label';
            label.textContent = `${node.name} (${node.code})`;
            label.onclick = function(e) {
                if (e.target !== checkbox) {
                    checkbox.checked = !checkbox.checked;
                    handleCheckboxChange(node.id, checkbox.checked, containerId);
                }
            };
            
            contentDiv.appendChild(toggleSpan);
            contentDiv.appendChild(checkbox);
            contentDiv.appendChild(label);
            
            nodeDiv.appendChild(contentDiv);
            
            // 子节点
            if (hasChildren) {
                const childrenDiv = document.createElement('div');
                childrenDiv.className = 'tree-children';
                node.children.forEach(child => {
                    childrenDiv.appendChild(renderMultiSelectTreeNode(child, level + 1, containerId, selectedIds));
                });
                nodeDiv.appendChild(childrenDiv);
            }
            
            return nodeDiv;
        }
        
        // 渲染只读资源树节点（不可选中，默认全部展开）
        function renderReadOnlyTreeNode(node, level = 0, selectedIds = []) {
            const hasChildren = node.children && node.children.length > 0;
            const nodeDiv = document.createElement('div');
            nodeDiv.className = 'tree-node' + (hasChildren ? '' : ' leaf');
            nodeDiv.dataset.nodeId = node.id;
            
            const isChecked = selectedIds.includes(node.id);
            
            const contentDiv = document.createElement('div');
            contentDiv.className = 'tree-node-content readonly';
            
            // 展开/折叠按钮（默认展开）
            const toggleSpan = document.createElement('span');
            toggleSpan.className = 'tree-toggle';
            if (hasChildren) {
                toggleSpan.textContent = '▼';
                toggleSpan.onclick = function(e) {
                    e.stopPropagation();
                    toggleTreeNode(nodeDiv);
                };
            }
            
            // 多选框（禁用状态）
            const checkbox = document.createElement('input');
            checkbox.type = 'checkbox';
            checkbox.className = 'tree-checkbox';
            checkbox.value = node.id;
            checkbox.checked = isChecked;
            checkbox.disabled = true;
            
            // 标签
            const label = document.createElement('span');
            label.className = 'tree-label';
            label.textContent = `${node.name} (${node.code})`;
            
            contentDiv.appendChild(toggleSpan);
            contentDiv.appendChild(checkbox);
            contentDiv.appendChild(label);
            
            nodeDiv.appendChild(contentDiv);
            
            // 子节点（默认展开）
            if (hasChildren) {
                const childrenDiv = document.createElement('div');
                childrenDiv.className = 'tree-children expanded';
                node.children.forEach(child => {
                    childrenDiv.appendChild(renderReadOnlyTreeNode(child, level + 1, selectedIds));
                });
                nodeDiv.appendChild(childrenDiv);
            }
            
            return nodeDiv;
        }
        
        // 切换树节点展开/折叠
        function toggleTreeNode(nodeDiv) {
            const children = nodeDiv.querySelector('.tree-children');
            const toggle = nodeDiv.querySelector('.tree-toggle');
            if (children) {
                children.classList.toggle('expanded');
                toggle.textContent = children.classList.contains('expanded') ? '▼' : '▶';
            }
        }
        
        // 处理复选框变化（单独选择，不联动）
        function handleCheckboxChange(resourceId, checked, containerId) {
            // 单独选择，不进行父子联动
        }
        
        // 获取容器中所有选中的资源ID
        function getSelectedresourceIds(containerId) {
            const container = document.getElementById(containerId);
            if (!container) return [];
            
            const checkboxes = container.querySelectorAll('input[type="checkbox"]:checked');
            return Array.from(checkboxes).map(cb => cb.value);
        }
        
        // 赋资源操作
        function handleGrant(userId, domain) {
            const modal = document.getElementById('grantModal');
            document.getElementById('grantUserId').value = userId;
            document.getElementById('grantDomain').value = domain;
            
            // 获取该用户已拥有的资源（用于预选中）
            const userresourceIds = userresources[userId] || [];
            
            // 构建资源树
            const tree = buildresourceTree(domain);
            const treeContainer = document.getElementById('grantresourceTree');
            treeContainer.innerHTML = '';
            
            if (tree.length > 0) {
                tree.forEach(rootNode => {
                    // 只显示该域下的资源，并预选中已拥有的资源
                    const domainresourceIds = allresources
                        .filter(p => p.domain === domain)
                        .map(p => p.id);
                    const selectedIds = userresourceIds.filter(id => domainresourceIds.includes(id));
                    treeContainer.appendChild(renderMultiSelectTreeNode(rootNode, 0, 'grantresourceTree', selectedIds));
                });
            } else {
                treeContainer.innerHTML = '<div style="padding: 20px; text-align: center; color: #999;">该域下暂无资源数据</div>';
            }
            
            modal.classList.add('show');
        }
        
        // 提交赋资源
        function handleSubmitGrant(event) {
            event.preventDefault();
            
            const userId = document.getElementById('grantUserId').value;
            const domain = document.getElementById('grantDomain').value;
            const selectedIds = getSelectedresourceIds('grantresourceTree');
            
            if (!userId || !domain) {
                alert('缺少必要参数');
                return;
            }
            
            if (selectedIds.length === 0) {
                alert('请至少选择一个资源');
                return;
            }
            
            // 保存用户资源
            if (!userresources[userId]) {
                userresources[userId] = [];
            }
            
            // 合并资源（去重）
            const domainresourceIds = allresources
                .filter(p => p.domain === domain)
                .map(p => p.id);
            
            // 移除该域下原有的资源
            userresources[userId] = userresources[userId].filter(id => !domainresourceIds.includes(id));
            
            // 添加新选中的资源
            userresources[userId] = [...userresources[userId], ...selectedIds];
            
            closeGrantModal();
            alert('赋资源成功');
            // 刷新表格
            renderTable(userId);
        }
        
        // 关闭赋资源弹窗
        function closeGrantModal() {
            const modal = document.getElementById('grantModal');
            modal.classList.remove('show');
            document.getElementById('grantForm').reset();
            document.getElementById('grantUserId').value = '';
            document.getElementById('grantDomain').value = '';
        }
        
        // 除资源操作
        function handleRevoke(userId, domain) {
            const modal = document.getElementById('revokeModal');
            document.getElementById('revokeUserId').value = userId;
            document.getElementById('revokeDomain').value = domain;
            
            // 获取该用户已拥有的资源
            const userresourceIds = userresources[userId] || [];
            
            // 只显示该域下已拥有的资源
            const domainresourceIds = allresources
                .filter(p => p.domain === domain)
                .map(p => p.id);
            const ownedresourceIds = userresourceIds.filter(id => domainresourceIds.includes(id));
            
            if (ownedresourceIds.length === 0) {
                const treeContainer = document.getElementById('revokeresourceTree');
                treeContainer.innerHTML = '<div style="padding: 20px; text-align: center; color: #999;">该域下暂无已赋资源的资源</div>';
                modal.classList.add('show');
                return;
            }
            
            // 构建资源树（只显示已拥有的资源）
            const tree = buildresourceTree(domain, ownedresourceIds);
            const treeContainer = document.getElementById('revokeresourceTree');
            treeContainer.innerHTML = '';
            
            if (tree.length > 0) {
                tree.forEach(rootNode => {
                    // 预选中所有已拥有的资源
                    treeContainer.appendChild(renderMultiSelectTreeNode(rootNode, 0, 'revokeresourceTree', ownedresourceIds));
                });
            } else {
                treeContainer.innerHTML = '<div style="padding: 20px; text-align: center; color: #999;">该域下暂无已赋资源的资源</div>';
            }
            
            modal.classList.add('show');
        }
        
        // 提交除资源
        function handleSubmitRevoke(event) {
            event.preventDefault();
            
            const userId = document.getElementById('revokeUserId').value;
            const domain = document.getElementById('revokeDomain').value;
            const selectedIds = getSelectedresourceIds('revokeresourceTree');
            
            if (!userId || !domain) {
                alert('缺少必要参数');
                return;
            }
            
            if (selectedIds.length === 0) {
                alert('请至少选择一个资源');
                return;
            }
            
            // 移除选中的资源
            if (userresources[userId]) {
                userresources[userId] = userresources[userId].filter(id => !selectedIds.includes(id));
            }
            
            closeRevokeModal();
            alert('除资源成功');
            // 刷新表格
            renderTable(userId);
        }
        
        // 关闭除资源弹窗
        function closeRevokeModal() {
            const modal = document.getElementById('revokeModal');
            modal.classList.remove('show');
            document.getElementById('revokeForm').reset();
            document.getElementById('revokeUserId').value = '';
            document.getElementById('revokeDomain').value = '';
        }
        
        // 查看资源操作
        function handleView(userId, domain) {
            const modal = document.getElementById('viewModal');
            document.getElementById('viewUserId').value = userId;
            document.getElementById('viewDomain').value = domain;
            
            // 获取该用户已拥有的资源
            const userresourceIds = userresources[userId] || [];
            
            // 只显示该域下已拥有的资源
            const domainresourceIds = allresources
                .filter(p => p.domain === domain)
                .map(p => p.id);
            const ownedresourceIds = userresourceIds.filter(id => domainresourceIds.includes(id));
            
            if (ownedresourceIds.length === 0) {
                const treeContainer = document.getElementById('viewresourceTree');
                treeContainer.innerHTML = '<div style="padding: 20px; text-align: center; color: #999;">该域下暂无已赋资源的资源</div>';
                modal.classList.add('show');
                return;
            }
            
            // 构建资源树（只显示已拥有的资源，使用只读模式）
            const tree = buildresourceTree(domain, ownedresourceIds);
            const treeContainer = document.getElementById('viewresourceTree');
            treeContainer.innerHTML = '';
            
            if (tree.length > 0) {
                tree.forEach(rootNode => {
                    // 使用只读树渲染，显示已拥有的资源，默认全部展开
                    treeContainer.appendChild(renderReadOnlyTreeNode(rootNode, 0, ownedresourceIds));
                });
            } else {
                treeContainer.innerHTML = '<div style="padding: 20px; text-align: center; color: #999;">该域下暂无已赋资源的资源</div>';
            }
            
            modal.classList.add('show');
        }
        
        // 关闭查看资源弹窗
        function closeViewModal() {
            const modal = document.getElementById('viewModal');
            modal.classList.remove('show');
            document.getElementById('viewDomain').value = '';
            document.getElementById('viewUserId').value = '';
        }
        
        // 初始化
        function init() {
            const userId = getUserIdFromUrl();
            
            if (!userId) {
                alert('缺少用户ID参数');
                window.location.href = 'user-management.html';
                return;
            }
            
            renderUserInfo(userId);
            renderTable(userId);
        }
        
        // 页面加载时初始化
        init();
    </script>
</body>
</html>
