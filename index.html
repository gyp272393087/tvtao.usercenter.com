<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>权限管理系统 - 首页</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }
        
        /* 背景装饰 */
        body::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.1) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: float 20s infinite linear;
            pointer-events: none;
        }
        
        @keyframes float {
            0% { transform: translate(0, 0); }
            100% { transform: translate(50px, 50px); }
        }
        
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 50px 40px;
            max-width: 900px;
            width: 100%;
            text-align: center;
            position: relative;
            z-index: 1;
            animation: fadeInUp 0.6s ease-out;
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .header {
            margin-bottom: 50px;
        }
        
        .logo {
            font-size: 64px;
            font-weight: bold;
            margin-bottom: 20px;
            display: inline-block;
            animation: pulse 2s ease-in-out infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        .title {
            font-size: 32px;
            color: #333;
            margin-bottom: 12px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        
        .subtitle {
            font-size: 16px;
            color: #666;
            margin-bottom: 0;
            line-height: 1.6;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }
        
        .nav-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 40px;
        }
        
        .nav-card {
            background: linear-gradient(135deg, #f5f7fa 0%, #ffffff 100%);
            border: 2px solid #e8ecf1;
            border-radius: 12px;
            padding: 30px 20px;
            text-decoration: none;
            color: #333;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }
        
        .nav-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            transform: scaleX(0);
            transition: transform 0.3s ease;
        }
        
        .nav-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.2);
            border-color: #667eea;
        }
        
        .nav-card:hover::before {
            transform: scaleX(1);
        }
        
        .nav-card-icon {
            font-size: 36px;
            margin-bottom: 8px;
        }
        
        .nav-card-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            margin: 0;
        }
        
        .nav-card-desc {
            font-size: 13px;
            color: #888;
            margin: 0;
            line-height: 1.4;
        }
        
        /* 响应式设计 */
        @media (max-width: 768px) {
            .container {
                padding: 40px 24px;
                border-radius: 16px;
            }
            
            .logo {
                font-size: 48px;
            }
            
            .title {
                font-size: 24px;
            }
            
            .subtitle {
                font-size: 14px;
            }
            
            .nav-grid {
                grid-template-columns: 1fr;
                gap: 16px;
            }
            
            .nav-card {
                padding: 24px 20px;
            }
        }
        
        @media (max-width: 480px) {
            body {
                padding: 12px;
            }
            
            .container {
                padding: 30px 20px;
            }
            
            .header {
                margin-bottom: 30px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">🔐</div>
            <h1 class="title">电视淘宝权控系统</h1>
            <p class="subtitle">统一管理权限、角色、资源和用户，保障系统安全与访问控制</p>
        </div>
        
        <div class="nav-grid">
            <a href="permission-management.html" class="nav-card">
                <div class="nav-card-icon">🛡️</div>
                <h3 class="nav-card-title">权限管理</h3>
                <p class="nav-card-desc">配置和管理系统权限</p>
            </a>
            
            <a href="role-management.html" class="nav-card">
                <div class="nav-card-icon">👥</div>
                <h3 class="nav-card-title">角色管理</h3>
                <p class="nav-card-desc">定义和管理用户角色</p>
            </a>
            
            <a href="resource-management.html" class="nav-card">
                <div class="nav-card-icon">📦</div>
                <h3 class="nav-card-title">资源管理</h3>
                <p class="nav-card-desc">管理系统资源与访问</p>
            </a>
            
            <a href="user-management.html" class="nav-card">
                <div class="nav-card-icon">👤</div>
                <h3 class="nav-card-title">用户权控管理</h3>
                <p class="nav-card-desc">管理用户权限与资源</p>
            </a>
        </div>
    </div>
</body>
</html>
